server:
  port: 9090

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pizza?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD:123456789}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:localhost} # Default to 'localhost' if not provided
      port: ${REDIS_PORT:6379}      # Default to 6379 if not provided
  kafka:
    client:
      dns:
        lookup: use_dns_cache
    bootstrap-servers: ${KAFKA_BROKER_SERVER:localhost}:${KAFKA_BROKER_PORT:9092}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      #transaction-id-prefix: tx.
      properties:
        "[spring.json.type.mapping]": pizza:com.example.pizzashop.models.Pizza
    consumer:
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
form: http://localhost:4200

api:
  prefix:
jwt:
  expiration: 2592000 #30 days = ???s
  secretKey: X6bdRaQvsEZowUfj9k0+Dp2fjJmNOCjvw+DGTt5+lOk=

vnpay:
  pay-url: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
  return-url: "${VNPAY_RETURN_URI:http://localhost:4200/payments/payment-callback}"
  tmn-code: "OMZF7JB7" # Add your TMN code here
  secret-key: "J6S80U7KQ2LKSIK0Q8QJK6K8LVVGPUVD" # Add your secret key here
  api-url: "https://sandbox.vnpayment.vn/merchant_webapi/api/transaction"

logging:
  level:
    org:
      springframework.security: DEBUG
